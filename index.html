.room-hud strong{display:block;font:12px monospace;color:#50664f}.room-hud small{display:block;font:9px/1.6 monospace;color:#87916f;margin-top:4px}
.room-hud>button{pointer-events:auto;border:2px solid #73816a;background:#f5edda;color:#687559;font:10px monospace;padding:9px 11px;box-shadow:2px 3px 0 #263c354d}
.interior-canvas .map-hotspots button.npc-hotspot{width:66px;height:90px;border-radius:5px}.interior-canvas .map-hotspots button.exit-hotspot{width:70px;height:40px;border-radius:3px}
.rpg-dialogue{position:absolute;bottom:13px;left:13px;right:13px;z-index:3;background:#fffbed;border:4px double #647562;border-radius:4px;padding:0 16px 10px;box-shadow:0 0 0 3px #e8e3cf,4px 6px 0 3px #213b3459;max-height:69%;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#b6bea1 #f5f0df}
.rpg-dialogue .dialogue-top{font:9px monospace;letter-spacing:.6px;padding:8px 0;border-color:#d9dcc6}.rpg-dialogue .dialogue-top button{font-size:20px}
.rpg-body{display:flex;gap:15px}.rpg-story{min-width:0;flex:1}.rpg-body.has-choices>.rpg-story{flex:1.05}.rpg-body.has-choices>.choices{flex:1}
.rpg-dialogue .speech{gap:11px;padding:14px 0 5px}.rpg-dialogue .speech .portrait{width:40px;height:49px;padding:2px;background:#e9e9d4;border:1px solid #c4cbb1;border-radius:1px}
.rpg-dialogue .speaker{font:10px monospace;font-weight:bold;letter-spacing:1px;color:#a38357}.rpg-dialogue .speech p{font:12px/1.85 monospace;color:#485d49;margin:7px 0 0}
.rpg-dialogue .question{font:bold 10px/1.7 monospace;color:#687859;margin:8px 0 8px;padding-left:0}
.rpg-dialogue .choices{margin:12px 0 0!important;gap:5px;align-self:start;border:2px solid #98a38a;padding:6px;background:#fbf7e6;border-radius:2px}
.rpg-dialogue .choices button{border:1px solid transparent;border-radius:1px;padding:7px 7px 7px 3px;background:transparent;gap:6px;font:10px/1.5 monospace;color:#566a4e;min-height:32px}
.rpg-dialogue .choices button:hover,.rpg-dialogue .choices button:focus{background:#e4ebd4;border-color:#a9b792;outline:none}.choice-caret{visibility:hidden;flex-shrink:0;color:#5c7851;font-size:14px}.rpg-dialogue .choices button:hover .choice-caret,.rpg-dialogue .choices button:focus .choice-caret{visibility:visible}
.rpg-dialogue .choices small{font:8px/1.65 monospace;color:#899275;margin-top:3px}.rpg-dialogue .choice-index{font:8px monospace;margin-left:auto;opacity:.5}.rpg-dialogue .dialogue-hint{font:7px monospace;color:#9da58a;margin-top:9px;letter-spacing:.4px}
.rpg-dialogue .primary{margin:10px 0 0 51px;width:calc(100% - 51px);background:transparent;color:#657752;border:0;font:10px monospace;text-align:right;padding:6px 0;justify-content:flex-end;gap:13px}.rpg-dialogue .primary:hover{color:#344d36}.rpg-dialogue .primary span{font-size:16px;animation:prompt-blink 1s steps(2,end) infinite}
.rpg-note{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.rpg-note .field{margin:8px 0 0 51px}.rpg-note textarea{padding:8px;font:11px/1.6 monospace;min-height:55px}.rpg-note .field>span{font:8px monospace}.rpg-note>.primary{width:auto;margin:0 0 4px;padding:10px}
@keyframes prompt-blink{50%{opacity:.25}}@keyframes room-enter{from{filter:brightness(.35)}to{filter:brightness(1)}}
@media(max-width:1050px){.rpg-body.has-choices{display:block}.rpg-dialogue .choices{margin-top:7px!important}.rpg-dialogue .choices button{padding-top:5px;padding-bottom:5px}.interior-stage{min-height:580px}.rpg-dialogue .speech p{font-size:11px}.rpg-dialogue .speech{padding-top:10px}.rpg-dialogue .primary{margin-left:51px!important;width:calc(100% - 51px)!important}}
@media(max-width:760px){.interior-stage{min-height:590px}.rpg-dialogue{left:9px;right:9px;bottom:10px;max-height:63%;padding:0 11px 9px}.interior-stage .interior-canvas{margin-top:35px}.room-hud{top:9px;left:9px;right:9px}.room-hud>div{padding:7px 9px 7px 35px;max-width:72%}.room-hud>div>span{font-size:12px;left:9px;top:9px}.room-hud strong{font-size:10px}.room-hud small{font-size:7px;margin-top:2px}.room-hud>button{font-size:8px;padding:7px}.rpg-dialogue .speech p{font-size:11px;line-height:1.9}.rpg-dialogue .speaker{font-size:9px}.rpg-dialogue .choices button{font-size:10px;min-height:36px}.rpg-dialogue .choices small{font-size:8px}.rpg-dialogue .dialogue-hint{font-size:6px}.rpg-note{display:block}.rpg-note .field{margin-left:0}.rpg-note>.primary{margin-left:0!important;width:100%!important}.rpg-dialogue .question{font-size:10px}.rpg-dialogue .dialogue-top{font-size:8px}}
@media(prefers-reduced-motion:reduce){.interior-stage,.rpg-dialogue .primary span{animation:none}}
.plan-choice{min-width:0;padding:0;border:0;margin:22px 0}.plan-choice>legend{font-size:11px;color:#6c7c5b;padding:0;margin-bottom:11px;line-height:1.7}.plan-presets{display:grid;grid-template-columns:1fr 1fr;gap:7px}.plan-presets>button{display:flex;align-items:flex-start;gap:9px;text-align:left;border:1px solid #d8dfc8;border-radius:4px;background:#f7f7eb;padding:12px;color:#748260;font-size:11px;line-height:1.7}.plan-presets>button:hover,.plan-presets>button[aria-pressed=true]{border-color:#9eb084;background:#e9efda;color:#536d45}.preset-mark{font-size:10px;margin-top:2px;flex-shrink:0;color:#91a079}.custom-plan{margin-bottom:0}.custom-plan textarea{font-size:11px}.rpg-note{display:block}.rpg-note .plan-choice{margin:9px 0}.rpg-note .plan-choice>legend{font:9px/1.7 monospace;margin-bottom:7px}.rpg-note .plan-presets{grid-template-columns:1fr;gap:4px}.rpg-note .plan-presets>button{font:10px/1.65 monospace;padding:7px 10px;border-radius:1px}.rpg-note .custom-plan{margin:10px 0 0}.rpg-note>.primary{margin-left:0!important;width:100%!important;padding:5px 0}.rpg-note .preset-mark{margin-top:1px}.rpg-note .plan-presets>button:focus{outline:2px solid #9aaa7e;outline-offset:1px}@media(max-width:760px){.plan-presets{grid-template-columns:1fr}.rpg-note .plan-presets>button{font-size:9px;padding:7px}.rpg-note .plan-choice{margin-bottom:0}}

 take longer",note:"Then we\u2019ll adjust the plan, not call it a failure.",set:{graduate:"no"}},{label:"I need to check",note:"That\u2019s a useful next step, not a wrong answer.",set:{graduate:"unknown"}}]},{speaker:"JISEON",text:"Your graduation project and the RLWRLD internship are two separate things. An internship offer isn\u2019t a graduation certificate, and one company\u2019s decision isn\u2019t a verdict on you. We can check the schedules without putting your future on one result.",choices:[{label:"I can make a plan for the TFG"},{label:"I\u2019ll check whether the schedules fit"},{label:"I need help breaking it into smaller steps"}]},{speaker:"NATHAN",text:"One small thing I can do next\u2026",noteKey:"graduationNote",placeholder:"For example: ask my supervisor what remains for my TFG and how the defence will work."},{speaker:"JISEON",text:"I can sit beside you, review a plan, or just listen. Finishing a little later doesn\u2019t mean your life is late. Let\u2019s keep making room for both your future and ours.",choices:[{label:"One step at a time. Together."}]}],career:[{speaker:"JISEON",text:"Welcome to Career Station. These are doors, not lifelong contracts. Where you live and what you do are different questions. Each direction can have possibilities in Korea and in Europe.",question:"Which door would you like to explore first?",choices:$l.map(e=>({label:e.title,note:e.description,set:{career:e.id}}))},{speaker:"JISEON",text:"We haven\u2019t applied to RLWRLD yet. Our plan is to apply in the first week of November 2026. Right now, we can prepare the application. Any offer or rejection below is only a later what-if, not something that has happened.",question:"Stay with our current plan, or explore a future possibility?",choices:[{label:"Keep our November application plan",note:"Not applied yet. Apply in the first week of November 2026.",set:{internship:"planned",internshipMode:"current"}},{label:"Prepare my CV and portfolio first",note:"Jiseon can help
